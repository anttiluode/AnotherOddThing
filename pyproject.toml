[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "another-odd-thing"
version = "0.1.0"
description = "Resident operators identified by small addressed perturbations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
